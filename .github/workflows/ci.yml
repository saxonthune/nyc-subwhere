name: ci

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm --filter @nyc-subwhere/web build

      # Validate the worker + wrangler config without credentials, so a broken
      # wrangler.toml or worker-only error fails the PR instead of the deploy.
      - run: pnpm --filter @nyc-subwhere/worker exec wrangler deploy --dry-run
